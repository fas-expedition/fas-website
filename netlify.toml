[build]
  base = "."
  command = "npm run build"
  publish = "_site"
  functions = "netlify/functions"

[context.deploy-preview]
  ignore = "true"

[context.branch-deploy]
  ignore = "true"

[[redirects]]
  from = "/"
  to = "/de/"
  status = 301
  force = true

# Redirect www to apex
[[redirects]]
  from = "https://www.fas-expedition.de/*"
  to = "https://fas-expedition.de/:splat"
  status = 301
  force = true

# Redirect .com to .de
[[redirects]]
  from = "https://fas-expedition.com/*"
  to = "https://fas-expedition.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.fas-expedition.com/*"
  to = "https://fas-expedition.de/:splat"
  status = 301
  force = true

# Handle form success redirects
[[redirects]]
  from = "/de/kontakt/"
  to = "/de/kontakt/"
  status = 200
  force = false

[[redirects]]
  from = "/en/contact/"
  to = "/en/contact/"
  status = 200
  force = false

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify Forms Configuration
# Email notifications for forms MUST be configured in the Netlify dashboard:
# Site settings → Forms → Form notifications → Add notification → Email
# (netlify.toml does not support form email notification configuration)
[[forms]]
  name = "inquiry"
  honeypot = "bot-field"

[[forms]]
  name = "contact"
  honeypot = "bot-field"

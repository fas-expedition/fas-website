          - { label: "Footer - 8x8", name: "footer.8x8", widget: "string" }
          - { label: "Footer - Modular Systems", name: "footer.modularSystems", widget: "string" }
          - { label: "Footer - Support", name: "footer.support", widget: "string" }
          - { label: "Footer - Documentation", name: "footer.documentation", widget: "string" }
          - { label: "Footer - Warranty", name: "footer.warranty", widget: "string" }
          - { label: "Footer - Service", name: "footer.service", widget: "string" }
          - { label: "Footer - Rights", name: "footer.rights", widget: "string" }

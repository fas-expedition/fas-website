backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "src/assets/images"
public_folder: "/assets/images"

collections:
  # ─── Page Content ───────────────────────────────────────────────
  - name: "pages"
    label: "Pages"
    files:
      # Home (DE)
      - name: "home_de"
        label: "Home (DE)"
        file: "src/_data/de/pages/home.json"
        fields:
          - { label: "Page - Title", name: "pageTitle", widget: "string", required: true }
          - { label: "Page - Description", name: "pageDescription", widget: "text", required: true }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Hero - Title", name: "title", widget: "string", required: true }
              - { label: "Hero - Subtitle", name: "subtitle", widget: "string", required: false }
              - { label: "Hero - Description", name: "description", widget: "text", required: true }
              - { label: "Hero - Image", name: "image", widget: "image", required: true }
              - { label: "Hero - CTA Text", name: "ctaText", widget: "string", required: true }
              - { label: "Hero - CTA URL", name: "ctaUrl", widget: "string", required: true }
          - label: "Features"
            name: "features"
            widget: "object"
            fields:
              - { label: "Features - Title", name: "title", widget: "string", required: true }
              - { label: "Features - Subtitle", name: "subtitle", widget: "text", required: false }
              - label: "Features - Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Icon", name: "icon", widget: "string", required: true }
                  - { label: "Title", name: "title", widget: "string", required: true }
                  - { label: "Description", name: "description", widget: "text", required: true }
          - label: "Vehicles"
            name: "vehicles"
            widget: "object"
            fields:
              - { label: "Vehicles - Title", name: "title", widget: "string", required: true }
              - label: "Vehicles - Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "ID", name: "id", widget: "string", required: true }
                  - { label: "Title", name: "title", widget: "string", required: true }
                  - { label: "Description", name: "description", widget: "text", required: true }
                  - { label: "Image", name: "image", widget: "image", required: true }
                  - { label: "Specs", name: "specs", widget: "string", required: true }
          - label: "CTA Section"
            name: "cta"
            widget: "object"
            fields:
              - { label: "CTA - Title", name: "title", widget: "string", required: true }
              - { label: "CTA - Description", name: "description", widget: "text", required: true }
              - { label: "CTA - Button Text", name: "ctaText", widget: "string", required: true }
              - { label: "CTA - Button URL", name: "ctaUrl", widget: "string", required: true }

      # Home (EN)
      - name: "home_en"
        label: "Home (EN)"
        file: "src/_data/en/pages/home.json"
        fields:
          - { label: "Page - Title", name: "pageTitle", widget: "string", required: true }
          - { label: "Page - Description", name: "pageDescription", widget: "text", required: true }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Hero - Title", name: "title", widget: "string", required: true }
              - { label: "Hero - Subtitle", name: "subtitle", widget: "string", required: false }
              - { label: "Hero - Description", name: "description", widget: "text", required: true }
              - { label: "Hero - Image", name: "image", widget: "image", required: true }
              - { label: "Hero - CTA Text", name: "ctaText", widget: "string", required: true }
              - { label: "Hero - CTA URL", name: "ctaUrl", widget: "string", required: true }
          - label: "Features"
            name: "features"
            widget: "object"
            fields:
              - { label: "Features - Title", name: "title", widget: "string", required: true }
              - { label: "Features - Subtitle", name: "subtitle", widget: "text", required: false }
              - label: "Features - Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Icon", name: "icon", widget: "string", required: true }
                  - { label: "Title", name: "title", widget: "string", required: true }
                  - { label: "Description", name: "description", widget: "text", required: true }
          - label: "Vehicles"
            name: "vehicles"
            widget: "object"
            fields:
              - { label: "Vehicles - Title", name: "title", widget: "string", required: true }
              - label: "Vehicles - Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "ID", name: "id", widget: "string", required: true }
                  - { label: "Title", name: "title", widget: "string", required: true }
                  - { label: "Description", name: "description", widget: "text", required: true }
                  - { label: "Image", name: "image", widget: "image", required: true }
                  - { label: "Specs", name: "specs", widget: "string", required: true }
          - label: "CTA Section"
            name: "cta"
            widget: "object"
            fields:
              - { label: "CTA - Title", name: "title", widget: "string", required: true }
              - { label: "CTA - Description", name: "description", widget: "text", required: true }
              - { label: "CTA - Button Text", name: "ctaText", widget: "string", required: true }
              - { label: "CTA - Button URL", name: "ctaUrl", widget: "string", required: true }

      # Expeditionsmobile (DE)
      - name: "expeditionsmobile_de"
        label: "Expeditionsmobile (DE)"
        file: "src/_data/de/pages/expeditionsmobile.json"
        fields: &expeditionsmobile_fields
          - { label: "Page - Title", name: "pageTitle", widget: "string", required: true }
          - { label: "Page - Description", name: "pageDescription", widget: "text", required: true }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Hero - Title", name: "title", widget: "string", required: true }
              - { label: "Hero - Subtitle", name: "subtitle", widget: "string", required: false }
              - { label: "Hero - Description", name: "description", widget: "text", required: false }
              - { label: "Hero - Image", name: "image", widget: "image", required: true }
              - { label: "Hero - CTA Text", name: "ctaText", widget: "string", required: false }
              - { label: "Hero - CTA URL", name: "ctaUrl", widget: "string", required: false }
          - label: "Vehicle Categories"
            name: "categories"
            widget: "list"
            fields:
              - { label: "Category - ID", name: "id", widget: "string", required: true }
              - { label: "Category - Title", name: "title", widget: "string", required: true }
              - { label: "Category - Description", name: "description", widget: "text", required: true }
              - { label: "Category - Image", name: "image", widget: "image", required: true }
              - { label: "Category - Specs", name: "specs", widget: "string", required: false }
              - { label: "Category - Link", name: "link", widget: "string", required: false }

      # Expeditionsmobile (EN)
      - name: "expeditionsmobile_en"
        label: "Expeditionsmobile (EN)"
        file: "src/_data/en/pages/expeditionsmobile.json"
        fields: *expeditionsmobile_fields

      # Modular Systems (DE)
      - name: "modular_systems_de"
        label: "Modulare Systeme (DE)"
        file: "src/_data/de/pages/modular-systems.json"
        fields: &modular_systems_fields
          - { label: "Page - Title", name: "pageTitle", widget: "string", required: true }
          - { label: "Page - Description", name: "pageDescription", widget: "text", required: true }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Hero - Title", name: "title", widget: "string", required: true }
              - { label: "Hero - Subtitle", name: "subtitle", widget: "string", required: false }
              - { label: "Hero - Description", name: "description", widget: "text", required: false }
              - { label: "Hero - Image", name: "image", widget: "image", required: true }
          - label: "Modules"
            name: "modules"
            widget: "list"
            fields:
              - { label: "Module - Title", name: "title", widget: "string", required: true }
              - { label: "Module - Description", name: "description", widget: "text", required: true }
              - { label: "Module - Image", name: "image", widget: "image", required: false }
              - label: "Module - Features"
                name: "features"
                widget: "list"
                field: { label: "Feature", name: "feature", widget: "string" }

      # Modular Systems (EN)
      - name: "modular_systems_en"
        label: "Modular Systems (EN)"
        file: "src/_data/en/pages/modular-systems.json"
        fields: *modular_systems_fields

      # BRABUS (DE)
      - name: "brabus_de"
        label: "BRABUS (DE)"
        file: "src/_data/de/pages/brabus.json"
        fields: &brabus_fields
          - { label: "Page - Title", name: "pageTitle", widget: "string", required: true }
          - { label: "Page - Description", name: "pageDescription", widget: "text", required: true }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Hero - Title", name: "title", widget: "string", required: true }
              - { label: "Hero - Subtitle", name: "subtitle", widget: "string", required: false }
              - { label: "Hero - Description", name: "description", widget: "text", required: true }
              - { label: "Hero - Image", name: "image", widget: "image", required: true }
          - label: "Editions"
            name: "editions"
            widget: "list"
            fields:
              - { label: "Edition - Title", name: "title", widget: "string", required: true }
              - { label: "Edition - Description", name: "description", widget: "text", required: true }
              - { label: "Edition - Image", name: "image", widget: "image", required: true }
              - { label: "Edition - Power", name: "power", widget: "string", required: true }
              - { label: "Edition - Torque", name: "torque", widget: "string", required: false }

      # BRABUS (EN)
      - name: "brabus_en"
        label: "BRABUS (EN)"
        file: "src/_data/en/pages/brabus.json"
        fields: *brabus_fields

      # Karriere (DE)
      - name: "karriere_de"
        label: "Karriere (DE)"
        file: "src/_data/de/pages/karriere.json"
        fields: &karriere_fields
          - { label: "Page - Title", name: "pageTitle", widget: "string", required: true }
          - { label: "Page - Description", name: "pageDescription", widget: "text", required: true }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Hero - Title", name: "title", widget: "string", required: true }
              - { label: "Hero - Subtitle", name: "subtitle", widget: "string", required: true }
          - { label: "Intro", name: "intro", widget: "text", required: true }
          - label: "Jobs"
            name: "jobs"
            widget: "list"
            fields:
              - { label: "Job - Title", name: "title", widget: "string", required: true }
              - { label: "Job - Location", name: "location", widget: "string", required: true }
              - { label: "Job - Division", name: "division", widget: "string", required: true }
              - label: "Job - Tasks"
                name: "tasks"
                widget: "list"
                field: { label: "Task", name: "task", widget: "string" }
              - label: "Job - Profile"
                name: "profile"
                widget: "list"
                field: { label: "Requirement", name: "requirement", widget: "string" }
              - label: "Job - Benefits"
                name: "benefits"
                widget: "list"
                field: { label: "Benefit", name: "benefit", widget: "string" }
              - { label: "Job - CTA Text", name: "ctaText", widget: "string", required: true }
              - { label: "Job - CTA URL", name: "ctaUrl", widget: "string", required: true }
              - { label: "Job - PDF URL", name: "pdfUrl", widget: "string", required: false }
          - label: "Application CTA"
            name: "applicationCta"
            widget: "object"
            fields:
              - { label: "CTA - Title", name: "title", widget: "string", required: true }
              - { label: "CTA - Description", name: "description", widget: "text", required: true }
              - { label: "CTA - Contact Name", name: "contactName", widget: "string", required: true }
              - { label: "CTA - Company", name: "contactCompany", widget: "string", required: true }
              - { label: "CTA - Address", name: "contactAddress", widget: "text", required: true }
              - { label: "CTA - Email", name: "contactEmail", widget: "string", required: true }
              - { label: "CTA - Button Text", name: "ctaText", widget: "string", required: true }
              - { label: "CTA - Button URL", name: "ctaUrl", widget: "string", required: true }

      # Karriere (EN)
      - name: "karriere_en"
        label: "Careers (EN)"
        file: "src/_data/en/pages/karriere.json"
        fields: *karriere_fields

  # ─── Translations ───────────────────────────────────────────────
  - name: "translations"
    label: "Translations"
    files:
      - name: "translations_de"
        label: "Translations (DE)"
        file: "src/_data/de/translations.json"
        fields:
          - { label: "Nav - Home", name: "nav.home", widget: "string" }
          - { label: "Nav - Expeditionsmobile", name: "nav.expeditionMobile", widget: "string" }
          - { label: "Nav - Modulare Systeme", name: "nav.modularSystems", widget: "string" }
          - { label: "Nav - BRABUS", name: "nav.brabus", widget: "string" }
          - { label: "Nav - Konfigurator", name: "nav.configurator", widget: "string" }
          - { label: "Nav - Blog", name: "nav.blog", widget: "string" }
          - { label: "Nav - Kundenportal", name: "nav.customerPortal", widget: "string" }
          - { label: "Hero - Title", name: "hero.title", widget: "string" }
          - { label: "Hero - Subtitle", name: "hero.subtitle", widget: "string" }
          - { label: "Hero - CTA", name: "hero.cta", widget: "string" }
          - { label: "Footer - Company", name: "footer.company", widget: "string" }
          - { label: "Footer - About", name: "footer.about", widget: "string" }
          - { label: "Footer - Team", name: "footer.team", widget: "string" }

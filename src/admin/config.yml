          - { label: "UI - Configurator", name: "ui.configurator", widget: "string" }
          - { label: "UI - Inquire Now", name: "ui.inquireNow", widget: "string" }
          - { label: "UI - Contact Specialist", name: "ui.contactSpecialist", widget: "string" }
          - { label: "UI - Coming Soon", name: "ui.comingSoon", widget: "string" }
          - { label: "UI - Back to Home", name: "ui.backToHome", widget: "string" }

      - name: "translations_en"
        label: "Translations (EN)"
        file: "src/_data/en/translations.json"
        fields:
          - { label: "Nav - Home", name: "nav.home", widget: "string" }
          - { label: "Nav - Expedition Vehicles", name: "nav.expeditionMobile", widget: "string" }
          - { label: "Nav - Modular Systems", name: "nav.modularSystems", widget: "string" }
          - { label: "Nav - BRABUS", name: "nav.brabus", widget: "string" }
          - { label: "Nav - Configurator", name: "nav.configurator", widget: "string" }
          - { label: "Nav - Blog", name: "nav.blog", widget: "string" }
          - { label: "Nav - Customer Portal", name: "nav.customerPortal", widget: "string" }
          - { label: "Hero - Title", name: "hero.title", widget: "string" }
          - { label: "Hero - Subtitle", name: "hero.subtitle", widget: "string" }
          - { label: "Hero - CTA", name: "hero.cta", widget: "string" }
          - { label: "Footer - Company", name: "footer.company", widget: "string" }
          - { label: "Footer - About", name: "footer.about", widget: "string" }

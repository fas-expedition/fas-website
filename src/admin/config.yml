  # ─── Site Settings ──────────────────────────────────────────────
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "site_settings"
        label: "Site Settings"
        file: "src/_data/site.json"
        fields:
          - { label: "Site Name", name: "name", widget: "string", required: true, pattern: [".{1,100}", "Maximum 100 characters"] }
          - { label: "Site URL", name: "url", widget: "string", required: true, pattern: ["^https://.*", "URL must start with https://"] }
          - { label: "Default Locale", name: "defaultLocale", widget: "select", options: ["de", "en"], required: true }
          - { label: "Locales", name: "locales", widget: "hidden", default: ["de", "en"] }

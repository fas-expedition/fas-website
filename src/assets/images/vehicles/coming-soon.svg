<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)"/>
  
  <!-- Border -->
  <rect x="0" y="0" width="400" height="400" fill="none" stroke="#444" stroke-width="2"/>
  
  <!-- "Coming Soon" Text -->
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="2">
    COMING SOON
  </text>
  
  <!-- Decorative line -->
  <line x1="80" y1="220" x2="320" y2="220" stroke="#666" stroke-width="2"/>
  
  <!-- Subtext -->
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#999">
    Hochwertige Bilder in Kürze verfügbar
  </text>
</svg>